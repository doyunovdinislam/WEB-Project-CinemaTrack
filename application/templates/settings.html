{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">⚙ Настройки профиля</h2>

<div class="card p-4 shadow" style="max-width:500px; border-radius:15px;">

    <!-- АВАТАР -->
    <div class="text-center mb-3">
        <img src="/static/img/{{ current_user.avatar }}"
             style="width:200px; height:200px; object-fit:cover; border-radius:10px;">
    </div>

    <!-- 🔥 ОСНОВНАЯ ФОРМА -->
    <form method="post" enctype="multipart/form-data">

        <!-- ЗАГРУЗКА -->
        <label class="mb-2">Выбрать новый аватар:</label>

        <input type="file"
               name="avatar"
               class="form-control mb-3">

        <!-- 🔥 УДАЛЕНИЕ АВАТАРА -->
        <button name="remove_avatar"
                value="1"
                class="btn btn-danger w-100 mb-3">
            🗑 Удалить фото
        </button>

        <hr>

        <!-- ОПИСАНИЕ -->
        <label class="mb-2">
            Описание профиля (макс. 120 символов)
        </label>

        <textarea name="description"
                  maxlength="120"
                  class="form-control mb-3"
                  rows="3"
                  placeholder="Расскажите о себе...">{{ current_user.description }}</textarea>

        <!-- СОХРАНИТЬ -->
        <button class="btn btn-success w-100">
            💾 Сохранить изменения
        </button>

    </form>

</div>

{% endblock %}
