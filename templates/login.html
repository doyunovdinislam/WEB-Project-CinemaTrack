{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-center align-items-center" style="height:70vh;">

    <div class="card p-4 shadow-lg" style="width:400px; border-radius:20px;">

        <h3 class="text-center mb-3">Вход</h3>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">

            <input name="username"
                   class="form-control mb-2"
                   placeholder="Логин"
                   required>

            <!-- ПАРОЛЬ С КНОПКОЙ -->
            <div class="position-relative mb-3">

                <input id="login_password"
                       name="password"
                       type="password"
                       class="form-control"
                       placeholder="Пароль"
                       required>

                <span onclick="togglePassword('login_password', this)"
                      style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer;">
                    👁
                </span>

            </div>

            <button class="btn btn-dark w-100">Войти</button>

        </form>

    </div>

</div>

{% endblock %}
